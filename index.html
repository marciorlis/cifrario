<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Cifras (ChordPro)</title>

  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-alt: #eef4ff;
      --primary: #2d5bff;
      --primary-dark: #1f46c8;
      --text: #1d2433;
      --muted: #5f6f89;
      --border: #dfe7f5;
      --accent: #ffcf5c;
      --shadow: 0 18px 40px rgba(31, 48, 92, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(180deg, #eef4ff 0%, #f9fbff 100%);
      color: var(--text);
    }

    .page {
      max-width: 980px;
      margin: 0 auto;
      padding: 48px 20px 60px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      padding: 28px;
    }

    header {
      margin-bottom: 24px;
    }

    .title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 3vw, 2.7rem);
      color: var(--text);
    }

    .badge {
      background: var(--panel-alt);
      color: var(--primary-dark);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    label {
      font-weight: 600;
      color: var(--muted);
    }

    select {
      min-width: 260px;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(45, 91, 255, 0.12);
    }

    .song-container {
      margin-top: 26px;
      line-height: 1.8;
      background: linear-gradient(180deg, #ffffff, #f7f9ff);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 28px;
      min-height: 220px;
    }

    .song-container p {
      margin: 0;
      color: var(--muted);
    }

    .song-container table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
    }

    .song-container td {
      padding: 6px 10px;
      vertical-align: top;
      border-bottom: 1px solid #edf2fb;
    }

    .song-container .chord {
      font-weight: 700;
      color: var(--primary-dark);
      white-space: nowrap;
      background: rgba(45, 91, 255, 0.06);
      border-radius: 6px;
      padding: 2px 4px;
    }

    .song-container h2,
    .song-container h3 {
      margin: 0 0 12px;
      color: var(--text);
    }

    .song-container pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: inherit;
      color: var(--text);
    }

    @media (max-width: 640px) {
      .panel { padding: 20px 16px; }
      .title { align-items: flex-start; }
      select { width: 100%; min-width: unset; }
      .song-container { padding: 18px 14px; }
    }
  </style>

  <!-- Biblioteca ChordSheetJS -->
  <script defer src="https://cdn.jsdelivr.net/npm/chordsheetjs@16.2.2/lib/bundle.min.js"></script>
  <!-- Aplicação local -->
  <script defer src="app.js"></script>
</head>
<body>
  <div class="page">
    <div class="panel">
      <header>
        <div class="title">
          <h1>Visualizador de Cifras</h1>
          <span class="badge">ChordPro</span>
        </div>

        <div class="controls">
          <label for="songSelect">Escolha uma música:</label>
          <select id="songSelect">
            <option value="">Carregando...</option>
          </select>
        </div>
      </header>

      <main id="cifraOutput" class="song-container">
        <p>Selecione uma música no menu acima.</p>
      </main>
    </div>
  </div>
</body>
</html>
